version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jarvis
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./automations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  job-automation:
    build:
      context: ./automations/job_automation
      dockerfile: Dockerfile
    container_name: jarvis-job-automation
    environment:
      - DATABASE_URL=postgresql://jarvis:${POSTGRES_PASSWORD}@postgres:5432/jarvis
      - OLLAMA_HOST=http://ollama:11434
      - NAUKRI_EMAIL=${NAUKRI_EMAIL}
      - NAUKRI_PASSWORD=${NAUKRI_PASSWORD}
      - INTERNSHALA_EMAIL=${INTERNSHALA_EMAIL}
      - INTERNSHALA_PASSWORD=${INTERNSHALA_PASSWORD}
      - INDEED_EMAIL=${INDEED_EMAIL}
      - INDEED_PASSWORD=${INDEED_PASSWORD}
      - FOUNDIT_EMAIL=${FOUNDIT_EMAIL}
      - FOUNDIT_PASSWORD=${FOUNDIT_PASSWORD}
    volumes:
      - ./automations/job_automation:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  linkedin-outreach:
    build:
      context: ./automations
      dockerfile: Dockerfile.linkedin
    container_name: jarvis-linkedin-outreach
    environment:
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    depends_on:
      - ollama
    restart: unless-stopped

  pinterest:
    build:
      context: ./automations
      dockerfile: Dockerfile.pinterest
    container_name: jarvis-pinterest
    environment:
      - PINTEREST_EMAIL=${PINTEREST_EMAIL}
      - PINTEREST_PASSWORD=${PINTEREST_PASSWORD}
    depends_on:
      - ollama
    restart: unless-stopped

  email-platform:
    build:
      context: ./automations
      dockerfile: Dockerfile.email
    container_name: jarvis-email-platform
    environment:
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: jarvis-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: jarvis-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/jarvis.json
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: jarvis-loki
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: jarvis-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/jarvis
      - ./automations:/var/log/automations
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  loki_data:
