groups:
  - name: jarvis_alerts
    interval: 30s
    rules:
      # High scraper error rate
      - alert: HighScraperErrorRate
        expr: rate(scraper_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Job scraper error rate > 10%"
          description: "{{ $labels.automation }} is failing at {{ $value }} errors/sec"

      # Slow LLM inference
      - alert: SlowLLMInference
        expr: histogram_quantile(0.95, rate(model_inference_duration_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM P95 inference latency > 2s"
          description: "Model {{ $labels.model }} is responding slowly"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "{{ $labels.instance }} has been unreachable for >1 minute"

      # Disk pressure
      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage > 85%"
          description: "Only {{ $value | humanizePercentage }} free on /"

      # No applications sent in 24h
      - alert: NoApplicationsSent
        expr: increase(applications_sent_total[24h]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No job applications sent in 24h"
          description: "Job auto-applier may be stuck or misconfigured"
