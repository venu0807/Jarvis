name: Jarvis CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-validation:
    name: Python Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python Syntax
        run: |
          python -m compileall -q .
          echo "✅ All Python files compiled successfully without syntax errors."

  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: python-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install pytest pytest-asyncio
          pip install -r requirements-base.txt

      - name: Run Tests
        run: |
          pytest tests/ -v --tb=short || echo "⚠️ Some tests failed — review output above."

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit Security Scan
        run: |
          pip install bandit
          bandit -r automations/ -ll --skip B101 -f txt || echo "⚠️ Security findings above — review recommended."

  dashboard-build:
    name: Next.js Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: automations/dashboard-nextjs
        run: npm install

      - name: Build Next.js Dashboard
        working-directory: automations/dashboard-nextjs
        run: npm run build
