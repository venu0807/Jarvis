name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Sunday check to catch portal DOM changes early
    - cron: "0 6 * * 0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run tests
        run: |
          python -m pytest tests/ -v --timeout=30

      - name: Check syntax in automation scripts
        run: |
          python -m py_compile automations/job-automation/auto_applier.py
          python -m py_compile automations/job-automation/run_pipeline.py
          python -m py_compile automations/job-automation/portals/indeed.py
          python -m py_compile automations/job-automation/portals/naukri.py
