name: Jarvis CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-validation:
    name: Python Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python Syntax
        run: |
          python -m compileall -q .
          echo "✅ All Python files compiled successfully without syntax errors."

  dashboard-build:
    name: Next.js Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: automations/dashboard-nextjs
        run: npm install

      - name: Build Next.js Dashboard
        working-directory: automations/dashboard-nextjs
        run: npm run build
