<!DOCTYPE html>
<html>
<head>
    <title>Fake CAPTCHA</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        .captcha-box { border: 2px solid #ccc; padding: 30px; background: white; border-radius: 10px; text-align: center; }
        .verify-btn { padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="captcha-box">
        <h2>Verify you are human</h2>
        <p>Please click the button below to continue.</p>
        <button class="verify-btn" onclick="document.body.innerHTML='<h1>Success! Verified.</h1>'">Click to Verify</button>
    </div>
</body>
</html>
