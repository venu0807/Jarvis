<!DOCTYPE html>
<html>
<head>
    <title>Job Application Form Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: 0 auto; }
        .question { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .question h3 { margin-top: 0; }
        input[type="text"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        label { display: block; margin-top: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Job Application Questions</h2>
    <div class="question">
        <h3>1. Which of the following skills do you have?</h3>
        <label><input type="radio" name="skill" value="c++"> C++</label>
        <label><input type="radio" name="skill" value="ruby"> Ruby</label>
        <label><input type="radio" name="skill" value="java"> Java</label>
        <label><input type="radio" name="skill" value="scala"> Scala</label>
    </div>
    
    <div class="question">
        <h3>2. How many years of experience do you have?</h3>
        <input type="text" id="exp_input" placeholder="Type your answer here...">
    </div>

    <button onclick="alert('Submitted!')">Submit Application</button>
</body>
</html>
