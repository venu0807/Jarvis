<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&family=Playfair+Display:ital@0;1&display=swap');
  
  body {
    margin: 0;
    padding: 0;
    width: 1000px;
    height: 1500px;
    background-color: #FDFBF7;
    font-family: 'Outfit', sans-serif;
    display: flex;
    flex-direction: column;
  }
  
  .image-container {
    height: 65%;
    width: 100%;
    background-image: url('{lifestyle_image_url}');
    background-size: cover;
    background-position: center;
    position: relative;
  }

  .amazon-logo {
    position: absolute;
    top: 40px;
    right: 40px;
    font-size: 35px;
    font-weight: 800;
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    background: rgba(0,0,0,0.3);
    padding: 10px 20px;
    border-radius: 30px;
  }
  
  .text-container {
    height: 35%;
    width: 100%;
    padding: 60px 80px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #2D3748;
  }

  .subtitle-top {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 32px;
    color: #E29578;
    margin-bottom: 15px;
  }

  .title {
    font-size: 75px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 20px;
    color: #1A202C;
    max-width: 850px;
    word-wrap: break-word;
  }

  .subtitle {
    font-size: 28px;
    font-weight: 300;
    color: #718096;
    line-height: 1.4;
    max-width: 800px;
  }

  .price-pill {
    position: absolute;
    bottom: -40px;
    right: 80px;
    background: #FF6B6B;
    color: white;
    padding: 20px 40px;
    border-radius: 50px;
    font-weight: 800;
    font-size: 45px;
    box-shadow: 0 15px 30px rgba(255,107,107,0.3);
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .price-pill span {
    font-size: 20px;
    text-transform: uppercase;
    font-weight: 500;
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="image-container">
    <div class="amazon-logo">amazon</div>
    <div class="price-pill">
      <span>Now</span> {price}
    </div>
  </div>
  <div class="text-container">
    <div class="subtitle-top">Must-Have Find ✨</div>
    <div class="title">{title}</div>
    <div class="subtitle">{subtitle}</div>
  </div>
</body>
</html>
