<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
  
  body {
    margin: 0;
    padding: 0;
    width: 1000px;
    height: 1500px;
    background-image: url('{lifestyle_image_url}');
    background-size: cover;
    background-position: center;
    font-family: 'Outfit', sans-serif;
    position: relative;
    color: white;
  }
  
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
    z-index: 1;
  }
  
  .content {
    z-index: 2;
    position: relative;
    width: 100%;
    height: 100%;
    padding: 60px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 30px;
    padding: 40px;
    margin-top: auto;
    display: flex;
    flex-direction: row;
    align-items: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }

  .text-content {
    flex: 1;
    padding-right: 40px;
  }

  .badge {
    display: inline-block;
    background: #fff;
    color: #000;
    padding: 10px 20px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 60px;
    font-weight: 600;
    line-height: 1.1;
    margin-bottom: 15px;
    color: #FFFFFF;
    text-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .subtitle {
    font-size: 24px;
    color: #E0E0E0;
    line-height: 1.4;
    margin-bottom: 30px;
  }

  .product-image-container {
    width: 300px;
    height: 300px;
    background: white;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }

  .product-image {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .price-tag {
    position: absolute;
    top: -20px;
    right: -20px;
    background: #FF6B6B;
    color: white;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    border: 4px solid white;
  }

  .cta-btn {
    display: inline-block;
    background: transparent;
    color: white;
    border: 3px solid white;
    padding: 15px 40px;
    border-radius: 40px;
    font-size: 24px;
    font-weight: 700;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    
    <div style="align-self: flex-end; font-size: 36px; font-weight: 700; letter-spacing: 2px;">amazon</div>
    
    <div class="glass-card">
      <div class="text-content">
        <div class="badge">Trending 2026</div>
        <div class="title">{title}</div>
        <div class="subtitle">{subtitle}</div>
        <div class="cta-btn">Shop Now</div>
      </div>
      
      <div class="product-image-container" style="position: relative;">
        <img src="{product_image_url}" class="product-image" />
        <div class="price-tag">{price}</div>
      </div>
    </div>
    
  </div>
</body>
</html>
