<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
  
  body {
    margin: 0; padding: 0; width: 1000px; height: 1500px;
    background-image: url('{lifestyle_image_url}');
    background-size: cover; background-position: center;
    font-family: 'Outfit', sans-serif;
  }
  
  .overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.4) 100%); z-index: 1;
  }
  
  .content {
    z-index: 2; position: relative; padding: 80px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column;
  }
  
  h1 { font-size: 80px; font-weight: 900; color: #111; margin: 0 0 60px 0; line-height: 1.1; }
  
  .step {
    background: white; border-radius: 30px; padding: 40px; margin-bottom: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1); display: flex; align-items: center;
  }
  
  .step-num {
    background: #111; color: white; width: 80px; height: 80px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; margin-right: 40px; flex-shrink: 0;
  }
  
  .step-text { font-size: 32px; font-weight: 700; color: #333; flex: 1; }
  
  .product-step {
    background: #FF6B6B; color: white;
  }
  .product-step .step-num { background: white; color: #FF6B6B; }
  .product-step .step-text { color: white; }
  
  .prod-img { width: 120px; height: 120px; background: white; border-radius: 20px; padding: 10px; margin-left: 20px; }
  .prod-img img { width: 100%; height: 100%; object-fit: contain; }
  
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <h1>My 3-Step<br>Aesthetic Routine ✨</h1>
    
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Declutter the space</div>
    </div>
    
    <div class="step product-step">
      <div class="step-num">2</div>
      <div class="step-text">Upgrade with this Amazon find ({price})</div>
      <div class="prod-img"><img src="{product_image_url}"></div>
    </div>
    
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Enjoy the vibes ☁️</div>
    </div>
    
    <div style="margin-top: auto; text-align: center; background: #111; color: white; padding: 25px; border-radius: 40px; font-size: 28px; font-weight: 700;">
      Link in Bio to Shop!
    </div>
  </div>
</body>
</html>
