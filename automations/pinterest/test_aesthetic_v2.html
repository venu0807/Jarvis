<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;600&display=swap');
  
  body {
    margin: 0;
    padding: 0;
    width: 1000px;
    height: 1500px;
    background-image: url('file:///mnt/c/Users/Venu/.gemini/antigravity-ide/brain/4b852682-1a1a-435a-b1ed-d025b90d2ffe/aesthetic_lamp_lifestyle_1783186438841.png');
    background-size: cover;
    background-position: center;
    font-family: 'Inter', sans-serif;
    position: relative;
    color: white;
  }
  
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.0) 100%);
    z-index: 1;
  }
  
  .content {
    z-index: 2;
    position: relative;
    width: 100%;
    height: 100%;
    padding: 80px;
    box-sizing: border-box;
  }

  /* Amazon Logo */
  .amazon-logo {
    position: absolute;
    top: 60px;
    right: 60px;
    font-size: 40px;
    font-weight: 800;
    color: #FF9900;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  /* Typography overlay matching the user's reference */
  .subtitle-top {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 36px;
    color: #F3E5D8;
    margin-bottom: 20px;
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 110px;
    font-weight: 600;
    line-height: 1.05;
    margin-bottom: 30px;
    color: #FFFFFF;
    text-shadow: 0 4px 15px rgba(0,0,0,0.4);
    max-width: 600px;
  }

  .subtitle {
    font-size: 32px;
    font-weight: 400;
    color: #E0E0E0;
    line-height: 1.4;
    max-width: 500px;
    margin-bottom: 80px;
  }

  .features {
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .feature-icon {
    width: 60px;
    height: 60px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .feature-text {
    font-size: 24px;
    font-weight: 600;
  }

  /* Price Badge */
  .price-badge {
    position: absolute;
    bottom: 80px;
    left: 80px;
    background: radial-gradient(circle, #FFFFFF 0%, #F5F5F5 100%);
    width: 280px;
    height: 280px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #333;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    border: 8px solid rgba(255,255,255,0.4);
    background-clip: padding-box;
  }

  .price-badge .only {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 32px;
    color: #888;
  }

  .price-badge .price {
    font-size: 72px;
    font-weight: 800;
    color: #111;
    margin: 5px 0;
  }

  .price-badge .deal {
    background: #FF6B6B;
    color: white;
    padding: 8px 24px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <div class="amazon-logo">amazon</div>
    
    <div class="subtitle-top">Pinterest Favorite ✨</div>
    <div class="title">Glow Up<br>Your Space</div>
    <div class="subtitle">Minimal light.<br>Maximum focus.</div>
    
    <div class="features">
      <div class="feature-item">
        <div class="feature-icon">👁️</div>
        <div class="feature-text">Eye Comfort</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">✨</div>
        <div class="feature-text">Touch Control</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">💡</div>
        <div class="feature-text">Warm Light</div>
      </div>
    </div>
    
    <div class="price-badge">
      <div class="only">Only</div>
      <div class="price">$29</div>
      <div class="deal">Limited Time</div>
    </div>
  </div>
</body>
</html>
