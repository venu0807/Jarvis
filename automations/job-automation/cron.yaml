# OpenClaw Cron — Daily Job Hunter
# Registered at: ~/.jarvis/automations/job-automation/cron.yaml

jobs:
  - id: daily-job-hunter
    name: "Daily Job Hunt"
    description: "Scrape → Auto-apply → Tailor manual resumes → Email only (Telegram removed 2026-06-16)"
    schedule: "0 9 * * *"        # every day at 9:00 AM
    timezone: "Asia/Kolkata"      # IST
    enabled: true
    command: >-
      python
      D:/Proposals/Jarvis/automations/job-automation/run_pipeline.py
    on_failure:
      notify_email: ${GMAIL_ADDRESS}
      message: "❌ Job hunter cron failed. Check logs at output/logs/"
    tags:
      - job-automation
      - resume
      - daily
