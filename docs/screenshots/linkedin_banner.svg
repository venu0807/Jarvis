<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="99" x2="1584" y2="99"/>
    <line x1="0" y1="198" x2="1584" y2="198"/>
    <line x1="0" y1="297" x2="1584" y2="297"/>
    <line x1="396" y1="0" x2="396" y2="396"/>
    <line x1="792" y1="0" x2="792" y2="396"/>
    <line x1="1188" y1="0" x2="1188" y2="396"/>
  </g>

  <!-- Glow accents -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="url(#glow)"/>
  <ellipse cx="1384" cy="200" rx="300" ry="200" fill="url(#glow)" opacity="0.5"/>

  <!-- Left side: Brand -->
  <g transform="translate(80, 120)">
    <!-- JARVIS Logo mark -->
    <circle cx="32" cy="32" r="32" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="32" cy="32" r="20" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
    <circle cx="32" cy="32" r="8" fill="url(#accent)"/>

    <!-- Brand name -->
    <text x="90" y="46" font-size="48" font-weight="800" fill="#f8fafc">JARVIS</text>
    <text x="92" y="78" font-size="14" font-weight="500" fill="#06b6d4" letter-spacing="2">LOCAL-FIRST AI AUTOMATION</text>
  </g>

  <!-- Middle: Architecture mini-diagram -->
  <g transform="translate(620, 130)">
    <!-- Connections -->
    <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.6">
      <!-- Flow lines -->
      <path d="M 60 60 L 180 60"/>
      <path d="M 240 60 L 360 60"/>
      <path d="M 420 60 L 540 60"/>
      <path d="M 600 60 L 720 60"/>

      <!-- Arrows -->
      <polygon points="180,56 188,60 180,64" fill="url(#accent)" opacity="0.6"/>
      <polygon points="360,56 368,60 360,64" fill="url(#accent)" opacity="0.6"/>
      <polygon points="540,56 548,60 540,64" fill="url(#accent)" opacity="0.6"/>
      <polygon points="720,56 728,60 720,64" fill="url(#accent)" opacity="0.6"/>
    </g>

    <!-- Input node -->
    <rect x="0" y="40" width="60" height="40" rx="6" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="30" y="58" font-size="9" fill="#94a3b8" text-anchor="middle">PORTALS</text>
    <text x="30" y="70" font-size="9" fill="#94a3b8" text-anchor="middle">4 sources</text>

    <!-- Browser Pool -->
    <rect x="180" y="40" width="60" height="40" rx="6" fill="url(#nodeGrad)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="210" y="58" font-size="9" fill="#94a3b8" text-anchor="middle">BROWSER</text>
    <text x="210" y="70" font-size="9" fill="#94a3b8" text-anchor="middle">POOL</text>

    <!-- Ollama -->
    <rect x="360" y="40" width="60" height="40" rx="6" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="390" y="58" font-size="9" fill="#94a3b8" text-anchor="middle">OLLAMA</text>
    <text x="390" y="70" font-size="9" fill="#94a3b8" text-anchor="middle">3 models</text>

    <!-- PostgreSQL -->
    <rect x="540" y="40" width="60" height="40" rx="6" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="570" y="58" font-size="9" fill="#94a3b8" text-anchor="middle">POSTGRES</text>
    <text x="570" y="70" font-size="9" fill="#94a3b8" text-anchor="middle">state</text>

    <!-- Observability -->
    <rect x="720" y="40" width="60" height="40" rx="6" fill="url(#nodeGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="750" y="58" font-size="9" fill="#94a3b8" text-anchor="middle">GRAFANA</text>
    <text x="750" y="70" font-size="9" fill="#94a3b8" text-anchor="middle">alerts</text>

    <!-- Metric labels above -->
    <text x="30" y="32" font-size="8" fill="#64748b" text-anchor="middle">INPUT</text>
    <text x="210" y="32" font-size="8" fill="#64748b" text-anchor="middle">SCRAPE</text>
    <text x="390" y="32" font-size="8" fill="#64748b" text-anchor="middle">GENERATE</text>
    <text x="570" y="32" font-size="8" fill="#64748b" text-anchor="middle">PERSIST</text>
    <text x="750" y="32" font-size="8" fill="#64748b" text-anchor="middle">MONITOR</text>

    <!-- Status text below -->
    <text x="390" y="120" font-size="11" fill="#10b981" text-anchor="middle" font-weight="600">99.2% uptime · 800ms P95</text>
    <text x="390" y="138" font-size="10" fill="#64748b" text-anchor="middle">$0 cloud AI cost · 8 GB RAM</text>
  </g>

  <!-- Right side: Stats + CTA -->
  <g transform="translate(1180, 130)">
    <!-- Big stat -->
    <text x="0" y="40" font-size="56" font-weight="800" fill="url(#accent)">25+</text>
    <text x="0" y="64" font-size="14" font-weight="600" fill="#f8fafc">Workflows</text>

    <text x="0" y="100" font-size="32" font-weight="700" fill="#10b981">$0</text>
    <text x="0" y="118" font-size="12" fill="#94a3b8">Cloud AI</text>

    <text x="120" y="40" font-size="32" font-weight="700" fill="#06b6d4">200+</text>
    <text x="120" y="58" font-size="12" fill="#94a3b8">Apps/mo</text>

    <text x="120" y="100" font-size="32" font-weight="700" fill="#a855f7">8GB</text>
    <text x="120" y="118" font-size="12" fill="#94a3b8">RAM only</text>

    <!-- GitHub link -->
    <g transform="translate(0, 150)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="140" y="20" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="600">github.com/venu0807/Jarvis →</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="392" width="1584" height="4" fill="url(#accent)"/>
</svg>
