version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${JARVIS_DB_PASS:-jarvis}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U jarvis -d jarvis
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - jarvis-network
  job-automation:
    build:
      context: ./automations/job-automation
      dockerfile: Dockerfile
    container_name: jarvis-job-auto
    env_file: ./automations/job-automation/.env
    environment:
    - DATABASE_URL=postgresql://jarvis:${JARVIS_DB_PASS:-jarvis}@postgres:5432/jarvis
    - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 8001:8000
    networks:
    - jarvis-network
    restart: unless-stopped
  pinterest:
    build:
      context: ./automations/pinterest
      dockerfile: Dockerfile
    container_name: jarvis-pinterest
    env_file: ./automations/pinterest/.env
    environment:
    - DATABASE_URL=postgresql://jarvis:${JARVIS_DB_PASS:-jarvis}@postgres:5432/jarvis
    - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 8002:8000
    networks:
    - jarvis-network
    restart: unless-stopped
  model-router:
    build:
      context: ./automations/model-router
      dockerfile: Dockerfile
    container_name: jarvis-model-router
    environment:
    - DATABASE_URL=postgresql://jarvis:${JARVIS_DB_PASS:-jarvis}@postgres:5432/jarvis
    - OLLAMA_HOST=http://host.docker.internal:11434
    - MODEL_ROUTER_API_KEY=${MODEL_ROUTER_API_KEY:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 8003:8000
    networks:
    - jarvis-network
    restart: unless-stopped
  dashboard:
    profiles:
    - with-dashboard
    build:
      context: ./automations/dashboard-nextjs
      dockerfile: Dockerfile
    container_name: jarvis-dashboard
    environment:
    - NEXT_PUBLIC_API_URL=http://localhost:8003
    ports:
    - 3000:3000
    depends_on:
    - model-router
    networks:
    - jarvis-network
    restart: unless-stopped
networks:
  jarvis-network:
    driver: bridge
volumes:
  postgres_data: null
